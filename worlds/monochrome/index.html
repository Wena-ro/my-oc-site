<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>角色 A — OC WORLDS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;700&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#f5f3f0;min-height:100vh;font-family:'Noto Serif SC',serif;cursor:none;color:#2a2a2a}
  .cursor{position:fixed;pointer-events:none;z-index:9999;width:11px;height:11px;border:1.5px solid #555;border-radius:50%;transform:translate(-50%,-50%);transition:width .18s,height .18s}
  .back{position:fixed;top:24px;left:28px;font-family:monospace;font-size:10px;letter-spacing:.2em;color:#bbb;text-decoration:none;z-index:100}
  .back:hover{color:#888}
 
  .page{display:flex;height:calc(100vh - 56px);padding:0 28px 28px;}
 
  /* LEFT — portrait card */
  .portrait{
    flex-shrink:0;
    width:280px;
    display:flex;flex-direction:column;gap:16px;
  }
  .portrait-img{
    width:280px;height:320px;
    border-radius:20px;
    background:#dbd8d2;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .portrait-img svg{opacity:.2}
  .portrait-name{font-size:28px;font-weight:700;letter-spacing:.04em;line-height:1.1}
  .portrait-en{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:#aaa;letter-spacing:.08em}
  .portrait-world{
    display:inline-block;
    font-family:monospace;font-size:9px;letter-spacing:.18em;
    background:#e8e4de;color:#888;
    padding:4px 10px;border-radius:20px;
    width:fit-content;
  }
 
  /* RIGHT — info */
  .info{
    flex:1;
    padding-left:48px;
    display:flex;flex-direction:column;gap:28px;
    overflow-y:auto;
  }
  .section-label{
    font-family:monospace;font-size:9px;letter-spacing:.2em;color:#bbb;
    margin-bottom:8px;
  }
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{
    font-size:12px;font-family:'Noto Serif SC',serif;font-weight:300;
    background:#eee;color:#666;padding:5px 14px;border-radius:20px;
  }
  .bio{font-size:14px;font-weight:300;line-height:2;color:#555;max-width:480px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:480px}
  .stat{background:#eee;border-radius:12px;padding:14px 16px}
  .stat-label{font-family:monospace;font-size:8px;letter-spacing:.15em;color:#aaa;margin-bottom:4px}
  .stat-val{font-size:15px;font-weight:400}
 
  .gallery-row{display:flex;gap:10px}
  .gallery-thumb{
    width:80px;height:80px;border-radius:10px;
    background:#dbd8d2;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .gallery-thumb svg{opacity:.2}
  </style>
</head>
<body>
  <div class="cursor" id="cur"></div>
  <a class="back" href="../../index.html">← index</a>
 
  <div class="page">
    <div class="portrait">
      <div class="portrait-img">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1"><circle cx="12" cy="8" r="5"/><path d="M3 21c0-5 4-9 9-9s9 4 9 9"/></svg>
      </div>
      <div>
        <div class="portrait-name">角色 A</div>
        <div class="portrait-en">Character A</div>
      </div>
      <div class="portrait-world">黑白灰</div>
    </div>
 
    <div class="info">
      <div>
        <div class="section-label">PROFILE</div>
        <div class="stats">
          <div class="stat"><div class="stat-label">AGE</div><div class="stat-val">—</div></div>
          <div class="stat"><div class="stat-label">HEIGHT</div><div class="stat-val">—</div></div>
          <div class="stat"><div class="stat-label">ROLE</div><div class="stat-val">—</div></div>
        </div>
      </div>
 
      <div>
        <div class="section-label">KEYWORDS</div>
        <div class="tags">
          <span class="tag">待填入</span>
          <span class="tag">待填入</span>
          <span class="tag">待填入</span>
        </div>
      </div>
 
      <div>
        <div class="section-label">ABOUT</div>
        <div class="bio">角色简介待填入。可以写性格、背景、故事起点……</div>
      </div>
 
      <div>
        <div class="section-label">GALLERY</div>
        <div class="gallery-row">
          <div class="gallery-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <div class="gallery-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <div class="gallery-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
        </div>
      </div>
    </div>
  </div>
 
  <script>
  const cur=document.getElementById('cur');
  let cx=0,cy=0;
  document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY});
  (function loop(){cur.style.left=cx+'px';cur.style.top=cy+'px';requestAnimationFrame(loop)})();
  </script>
</body>
</html>
