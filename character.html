<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OC WORLDS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Noto+Serif+SC:wght@300;400;700&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#fff;font-family:'Noto Serif SC',serif;color:#111;cursor:none}

  #cur{position:fixed;pointer-events:none;z-index:99999;
    width:11px;height:11px;border:1.5px solid #333;border-radius:50%;
    transform:translate(-50%,-50%);
    transition:width .18s,height .18s,background .18s,border-color .18s}
  #cur.h{width:20px;height:20px;border-color:#888}
  #cur.d{width:7px;height:7px;background:#333;border-color:#333}

  .back{position:fixed;top:20px;left:24px;font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:.2em;color:#bbb;text-decoration:none;z-index:99998}
  .back:hover{color:#555}

  /* canvas fills screen, handles mouse */
  #c{position:fixed;top:0;left:0;z-index:10}

  /* emoji labels above canvas */
  #lb{position:fixed;top:0;left:0;pointer-events:none;z-index:11}
  .lbl{position:absolute;font-size:26px;transform:translate(-50%,-50%);pointer-events:none;line-height:1}

  /* UI above everything, no pointer events except back link */
  #ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:12;pointer-events:none}

  .illust{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:200px;height:75vh;border-radius:12px;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .illust img{width:100%;height:100%;object-fit:cover;object-position:top}
  .illust svg{opacity:.18}

  .profile{position:absolute;left:50%;top:50%;transform:translate(130px,-50%);width:210px}
  .pl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.22em;color:#bbb;
    border-bottom:1.5px solid #111;padding-bottom:8px;margin-bottom:16px}
  .wt{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;color:#bbb;margin-bottom:3px}
  .cn{font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}
  .ce{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:#aaa;margin-bottom:18px}
  .row{display:grid;grid-template-columns:60px 1fr;padding:9px 0;border-bottom:0.5px solid #e8e8e8;align-items:baseline}
  .rl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.1em;color:#bbb}
  .rv{font-size:14px;font-weight:700}
  .rv.s{font-size:12px;font-weight:400;color:#777;line-height:1.8}
  </style>
</head>
<body>

<div id="cur"></div>
<a class="back" href="index.html">← index</a>
<canvas id="c"></canvas>
<div id="lb"></div>

<div id="ui">
  <div class="illust" id="illust">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width=".8">
      <circle cx="12" cy="7" r="5"/><path d="M2 22c0-6 4.5-10 10-10s10 4 10 10"/>
    </svg>
  </div>
  <div class="profile">
    <div class="pl">PROFILE</div>
    <div class="wt" id="cWorld"></div>
    <div class="cn"  id="cName"></div>
    <div class="ce"  id="cEn"></div>
    <div class="row"><span class="rl">年龄</span><span class="rv"   id="sAge"></span></div>
    <div class="row"><span class="rl">身高</span><span class="rv"   id="sH"></span></div>
    <div class="row"><span class="rl">生日</span><span class="rv"   id="sB"></span></div>
    <div class="row"><span class="rl">性别</span><span class="rv"   id="sG"></span></div>
    <div class="row"><span class="rl">关键词</span><span class="rv s" id="sT"></span></div>
    <div class="row"><span class="rl">简介</span><span class="rv s"  id="sBio"></span></div>
  </div>
</div>

<script src="matter.min.js"></script>
<script>
var CHARS={
  'char-a':{name:'角色 A',en:'Character A',world:'黑白灰',bg:'#dbd8d2',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入·待填入',bio:'角色简介待填入。',float:false,items:['🗡️','🩶','🌫️','🕯️','📌','🪡','🧷','⛓️','🖤','🪦']},
  'char-b':{name:'角色 B',en:'Character B',world:'蓝绿',bg:'#cfdce0',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入·待填入',bio:'角色简介待填入。',float:false,items:['🌊','🐟','☔','🧃','🌿','💙','🫧','🎐','🍃','🌱']},
  'char-c':{name:'角色 C',en:'Character C',world:'天国列车',bg:'#dedad2',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入·待填入',bio:'角色简介待填入。',float:false,items:['🪶','✨','🕊️','☁️','🌙','⭐','🪄','🔔','🌸','💫']},
  'char-d':{name:'角色 D',en:'Character D',world:'BIBI',bg:'#d5d0e0',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入·待填入',bio:'角色简介待填入。',float:true,items:['🪐','🌌','👾','🍬','📻','🎀','💜','🌠','🛸','🍭']},
  'char-e':{name:'角色 E',en:'Character E',world:'赤色',bg:'#e0d4d2',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入·待填入',bio:'角色简介待填入。',float:false,items:['🌹','🧧','🎋','🪷','🍂','🫀','🏮','🎴','🌺','♦️']},
  'char-f':{name:'角色 F',en:'Character F',world:'黑白灰',bg:'#dbd8d2',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入',bio:'角色简介待填入。',float:false,items:['🗡️','🩶','🌫️','🕯️','📌','🪡','🧷','⛓️','🖤','🪦']},
  'char-g':{name:'角色 G',en:'Character G',world:'蓝绿',bg:'#cfdce0',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入',bio:'角色简介待填入。',float:false,items:['🌊','🐟','☔','🧃','🌿','💙','🫧','🎐','🍃','🌱']},
  'char-h':{name:'角色 H',en:'Character H',world:'天国列车',bg:'#dedad2',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入',bio:'角色简介待填入。',float:false,items:['🪶','✨','🕊️','☁️','🌙','⭐','🪄','🔔','🌸','💫']},
  'char-i':{name:'角色 I',en:'Character I',world:'BIBI',bg:'#d5d0e0',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入',bio:'角色简介待填入。',float:true,items:['🪐','🌌','👾','🍬','📻','🎀','💜','🌠','🛸','🍭']},
  'char-j':{name:'角色 J',en:'Character J',world:'赤色',bg:'#e0d4d2',image:'',age:'—',height:'—',birth:'—',gender:'—',tags:'待填入',bio:'角色简介待填入。',float:false,items:['🌹','🧧','🎋','🪷','🍂','🫀','🏮','🎴','🌺','♦️']}
};

var id=(new URLSearchParams(window.location.search)).get('id')||'char-a';
var ch=CHARS[id]||CHARS['char-a'];

// fill profile
document.title=ch.name+' — OC WORLDS';
document.getElementById('cWorld').textContent=ch.world;
document.getElementById('cName').textContent=ch.name;
document.getElementById('cEn').textContent=ch.en;
document.getElementById('sAge').textContent=ch.age;
document.getElementById('sH').textContent=ch.height;
document.getElementById('sB').textContent=ch.birth;
document.getElementById('sG').textContent=ch.gender;
document.getElementById('sT').textContent=ch.tags;
document.getElementById('sBio').textContent=ch.bio;
var il=document.getElementById('illust');
il.style.background=ch.bg;
if(ch.image) il.innerHTML='<img src="'+ch.image+'" alt="'+ch.name+'">';

// ── cursor ───────────────────────────────────────
var cur=document.getElementById('cur');
var mx=0,my=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
(function tick(){cur.style.left=mx+'px';cur.style.top=my+'px';requestAnimationFrame(tick);})();

// ── Matter.js ────────────────────────────────────
var W=window.innerWidth, H=window.innerHeight;
var canvas=document.getElementById('c');
canvas.width=W; canvas.height=H;
var ctx=canvas.getContext('2d');

var M=Matter;
var engine=M.Engine.create({gravity:{x:0,y:ch.float?0:1.5}});
var world=engine.world;

// walls
M.World.add(world,[
  M.Bodies.rectangle(W/2,H+25,W+4,50,{isStatic:true,friction:0.8,restitution:0.1}),
  M.Bodies.rectangle(-25,H/2,50,H+4,{isStatic:true,friction:0.5}),
  M.Bodies.rectangle(W+25,H/2,50,H+4,{isStatic:true,friction:0.5}),
  M.Bodies.rectangle(W/2,-25,W+4,50,{isStatic:true})
]);

var labelMap={}, physBodies=[], lb=document.getElementById('lb'), idx=0;

function addObj(){
  var s=52, cx2=W/2, gap=110, x, y;
  if(ch.float){
    // float: spread across whole screen avoiding center illust
    if(Math.random()<.5) x=10+Math.random()*Math.max(20,cx2-gap-s);
    else x=(cx2+gap)+Math.random()*Math.max(20,W-cx2-gap-s);
    x=Math.max(10,Math.min(W-s-10,x));
    y=30+Math.random()*(H-100);
  } else {
    // gravity: drop from top, left or right of center illust
    if(Math.random()<.5) x=10+Math.random()*Math.max(20,cx2-gap-s);
    else x=(cx2+gap)+Math.random()*Math.max(20,W-cx2-gap-s);
    x=Math.max(10,Math.min(W-s-10,x));
    y=-80;
  }
  var b=M.Bodies.rectangle(x+s/2,y+s/2,s,s,{
    friction:0.7,frictionAir:ch.float?.004:.01,restitution:0.2,density:.002
  });
  if(ch.float){
    var a=Math.random()*Math.PI*2,spd=.4+Math.random()*.3;
    M.Body.setVelocity(b,{x:Math.cos(a)*spd,y:Math.sin(a)*spd});
  }
  M.World.add(world,b);
  physBodies.push(b);
  var el=document.createElement('div');
  el.className='lbl';
  el.textContent=ch.items[idx%ch.items.length]; idx++;
  lb.appendChild(el);
  labelMap[b.id]=el;
}

// mouse drag
var mouse=M.Mouse.create(canvas);
var mc=M.MouseConstraint.create(engine,{mouse:mouse,constraint:{stiffness:.15,damping:.1}});
M.World.add(world,mc);

// cursor hover state when dragging
M.Events.on(mc,'startdrag',function(){cur.classList.add('d');});
M.Events.on(mc,'enddrag',function(){cur.classList.remove('d');});

// render
function render(){
  M.Engine.update(engine,1000/60);
  ctx.clearRect(0,0,W,H);
  physBodies.forEach(function(b){
    var p=b.position,a=b.angle,s=26;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(a);
    ctx.beginPath();
    ctx.roundRect(-s,-s,s*2,s*2,10);
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.fill();
    ctx.strokeStyle='#e0e0e0';
    ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
    var el=labelMap[b.id];
    if(el){
      el.style.left=p.x+'px'; el.style.top=p.y+'px';
      el.style.transform='translate(-50%,-50%) rotate('+a+'rad)';
    }
  });
  requestAnimationFrame(render);
}
render();

// spawn
var total=ch.float?8:12, cnt=0;
function drop(){
  addObj(); cnt++;
  if(cnt<total) setTimeout(drop,(cnt<4?120:(ch.float?380:300))+Math.random()*200);
}
setTimeout(drop,200);
</script>
</body>
</html>
