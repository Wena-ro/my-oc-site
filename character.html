<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OC WORLDS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Serif+SC:wght@300;400;700&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;cursor:none}
  body{background:#f5f3f0;font-family:'Noto Serif SC',serif;color:#2a2a2a}

  .cursor{position:fixed;pointer-events:none;z-index:9999;width:11px;height:11px;border:1.5px solid #555;border-radius:50%;transform:translate(-50%,-50%);transition:width .18s,height .18s}

  .back{
    position:fixed;top:22px;left:28px;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;
    color:#bbb;text-decoration:none;z-index:100;
    transition:color .2s;
  }
  .back:hover{color:#666}

  .page{
    display:grid;
    grid-template-columns:320px 1fr;
    height:100vh;
  }

  /* ── LEFT PANEL ── */
  .left{
    display:flex;flex-direction:column;
    padding:64px 32px 32px;
    height:100vh;
  }
  .portrait-img{
    flex:1;
    min-height:0;
    border-radius:20px;
    background:#dbd8d2;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    margin-bottom:20px;
  }
  .portrait-img img{width:100%;height:100%;object-fit:cover}
  .portrait-img .placeholder-icon{opacity:.18}
  .char-name{font-size:32px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin-bottom:6px}
  .char-en{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:#aaa;letter-spacing:.08em;margin-bottom:14px}
  .char-world{
    display:inline-block;
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;
    background:#e8e4de;color:#888;
    padding:5px 14px;border-radius:20px;width:fit-content;
  }

  /* ── RIGHT PANEL ── */
  .right{
    padding:64px 48px 32px;
    height:100vh;
    overflow-y:auto;
    display:flex;flex-direction:column;gap:32px;
  }
  .right::-webkit-scrollbar{width:4px}
  .right::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}

  .section-label{
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.22em;
    color:#bbb;margin-bottom:10px;
  }

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:#eee;border-radius:12px;padding:14px 16px}
  .stat-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.15em;color:#aaa;margin-bottom:5px}
  .stat-val{font-size:16px;font-weight:400}

  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;font-weight:300;background:#eee;color:#666;padding:5px 14px;border-radius:20px}

  .bio{font-size:14px;font-weight:300;line-height:2;color:#555;max-width:520px}

  .gallery{display:flex;gap:10px;flex-wrap:wrap}
  .gallery-thumb{
    width:100px;height:100px;border-radius:12px;
    background:#e2dfd9;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;
  }
  .gallery-thumb img{width:100%;height:100%;object-fit:cover}
  .gallery-thumb svg{opacity:.22}
  </style>
</head>
<body>
  <div class="cursor" id="cur"></div>
  <a class="back" href="index.html">← index</a>
  <div class="page">
    <div class="left">
      <div class="portrait-img" id="portraitImg">
        <svg class="placeholder-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1"><circle cx="12" cy="8" r="5"/><path d="M3 21c0-5 4-9 9-9s9 4 9 9"/></svg>
      </div>
      <div class="char-name" id="charName">—</div>
      <div class="char-en" id="charEn">—</div>
      <div class="char-world" id="charWorld">—</div>
    </div>
    <div class="right">
      <div>
        <div class="section-label">PROFILE</div>
        <div class="stats">
          <div class="stat"><div class="stat-label">AGE</div><div class="stat-val" id="statAge">—</div></div>
          <div class="stat"><div class="stat-label">HEIGHT</div><div class="stat-val" id="statHeight">—</div></div>
          <div class="stat"><div class="stat-label">ROLE</div><div class="stat-val" id="statRole">—</div></div>
        </div>
      </div>
      <div>
        <div class="section-label">KEYWORDS</div>
        <div class="tags" id="tags"></div>
      </div>
      <div>
        <div class="section-label">ABOUT</div>
        <div class="bio" id="bio">—</div>
      </div>
      <div>
        <div class="section-label">GALLERY</div>
        <div class="gallery" id="gallery"></div>
      </div>
    </div>
  </div>
  <script src="character.js"></script>
</body>
</html>
